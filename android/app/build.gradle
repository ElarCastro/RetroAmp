plugins { id 'com.android.application' }

def props = new Properties()
def vf = rootProject.file('version.properties')
if (vf.exists()) vf.withInputStream { props.load(it) }

android {
    namespace 'com.elarcastro.retroamp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.elarcastro.retroamp'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(props.getProperty('versionCode', '1'))
        versionName props.getProperty('versionName', '1.0')
    }
    signingConfigs {
        release {
            // Llave privada (secreto del repositorio) si existe; si no, la llave de PRUEBAS del repositorio.
            def ks = System.getenv('RA_KEYSTORE')
            storeFile file(ks ?: '../pruebas.keystore')
            storePassword System.getenv('RA_KS_PASS') ?: 'retroamp-pruebas'
            keyAlias System.getenv('RA_KEY_ALIAS') ?: 'pruebas'
            keyPassword System.getenv('RA_KEY_PASS') ?: 'retroamp-pruebas'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.3'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
