# Compila RetroAmp para Android (APK) en los equipos de GitHub y lo deja en el lanzamiento "android-pruebas".
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'RetroAmp.html', 'lib/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Copiar la interfaz al APK
        run: |
          mkdir -p android/app/src/main/assets/www/lib android/app/src/main/assets/www/fonts
          cp RetroAmp.html android/app/src/main/assets/www/
          cp lib/hls.min.js android/app/src/main/assets/www/lib/
          cp VT323-Regular.ttf android/app/src/main/assets/www/fonts/
      - name: Llave de firma (si está en los secretos del repositorio)
        env:
          KS: ${{ secrets.RA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/ra.keystore"; echo "RA_KEYSTORE=$RUNNER_TEMP/ra.keystore" >> "$GITHUB_ENV"; fi
      - name: Compilar
        env:
          RA_KS_PASS: ${{ secrets.RA_KS_PASS }}
          RA_KEY_ALIAS: ${{ secrets.RA_KEY_ALIAS }}
          RA_KEY_PASS: ${{ secrets.RA_KEY_PASS }}
        run: |
          cd android
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee ../compilacion.txt
      - name: Probar YouTube (sin Android)
        if: always()
        continue-on-error: true
        run: |
          cd android
          timeout 300 gradle --no-daemon -q :probe:run > ../prueba-youtube.txt 2>&1 || true
          cat ../prueba-youtube.txt
      - name: Publicar en el lanzamiento de pruebas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep versionName android/version.properties | cut -d= -f2)
          echo "commit ${GITHUB_SHA} · ${{ job.status }} · $(date -u +%FT%TZ)" > estado.txt
          [ -f compilacion.txt ] || echo "sin registro" > compilacion.txt
          gh release view android-pruebas >/dev/null 2>&1 || gh release create android-pruebas --prerelease --latest=false --target main \
            --title "RetroAmp Android (pruebas)" --notes "APK de pruebas de RetroAmp para Android. Se actualiza solo con cada cambio."
          [ -f prueba-youtube.txt ] || echo 'sin prueba' > prueba-youtube.txt
          gh release upload android-pruebas estado.txt compilacion.txt prueba-youtube.txt --clobber
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then cp "$APK" "RetroAmp-${V}-android.apk"; gh release upload android-pruebas "RetroAmp-${V}-android.apk" --clobber; fi
